services:
  mangazone:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: Mangazone_backend
    env_file:
      - .env
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=database;Port=5432;Database=postgres;Username=postgres.mruxtgnyueiermswvmzn;Password=${DB_PASSWORD}
      - ASPNETCORE_URLS=http://+:8080
      - Jwt__Key=${Jwt__Key}
      - Jwt__Issuer=${Jwt__Issuer:-ProjectManga.Api}
      - Jwt__Audience=${Jwt__Audience:-ProjectManga.Client}
      - Jwt__AccessTokenMinutes=${Jwt__AccessTokenMinutes:-120}
      - Minio__Endpoint=minio:9000
      - Minio__PublicEndpoint=${MINIO_PUBLIC_ENDPOINT:-}
      - Minio__AccessKey=${MINIO_USER}
      - Minio__SecretKey=${MINIO_PASSWORD}
      - Minio__Bucket=${MINIO_BUCKET:-manga-images}
      - Minio__UseSSL=${MINIO_USE_SSL:-false}
      - Minio__PublicUseSSL=${MINIO_PUBLIC_USE_SSL:-false}
      - Cors__AllowedOrigins__0=${CORS_ALLOWED_ORIGIN_0:-}
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./manga-project-firebase-admin-key.json:/app/manga-project-firebase-admin-key.json:ro
    networks:
      - Mangazone-networks
    restart: unless-stopped

  mangazone_e2e:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: Mangazone_backend_e2e
    env_file:
      - .env
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=E2E
      - ConnectionStrings__DefaultConnection=Host=database_e2e;Port=5432;Database=postgres;Username=postgres.mruxtgnyueiermswvmzne2e;Password=${DB_PASSWORD_E2E}
      - ASPNETCORE_URLS=http://+:8080
      - Minio__Endpoint=minio:9000
      - Minio__PublicEndpoint=${IP_LAN}:9004
      - Minio__UseSSL=false
      - Minio__Bucket=manga-e2e
    depends_on:
      database_e2e:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - Mangazone-networks
    restart: unless-stopped

  database:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres.mruxtgnyueiermswvmzn
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U postgres.mruxtgnyueiermswvmzn -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - Mangazone-networks

  database_e2e:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres.mruxtgnyueiermswvmzne2e
      POSTGRES_PASSWORD: ${DB_PASSWORD_E2E}
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-e2e-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres.mruxtgnyueiermswvmzne2e -d postgres",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - Mangazone-networks

  minio:
    image: minio/minio:latest
    container_name: Mangazone-minio
    ports:
      - "9004:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://${IP_LAN}:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - minio-data:/data
    networks:
      - Mangazone-networks
    restart: unless-stopped

volumes:
  postgres-data:
  postgres-e2e-data:
  minio-data:

networks:
  Mangazone-networks:
    driver: bridge
